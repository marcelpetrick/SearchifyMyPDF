# SPDX-License-Identifier: GPL-3.0-or-later
# Mirrors ./localPipeline.sh: the workflow only prepares the runner and calls the script.
name: Local Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: localPipeline.sh (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install system packages (Tesseract, Qt runtime libraries)
        run: scripts/install_ci_dependencies.sh
      - name: Run the local pipeline
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          if [ "${{ matrix.python }}" = "3.12" ]; then ./localPipeline.sh; else ./localPipeline.sh --no-package --no-docker; fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-py${{ matrix.python }}
          path: |
            reports/
            coverage.json
          if-no-files-found: ignore
      - name: Upload Linux binary
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: searchify-pdf-linux-x86_64
          path: dist/binary/
          if-no-files-found: ignore
