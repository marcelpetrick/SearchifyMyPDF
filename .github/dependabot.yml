version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci(deps)" }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(docker)" }
    ignore:
      # The images follow the supported Python (requires-python, PySide6 and OCRmyPDF
      # wheels); a new minor Python is adopted deliberately, not by a bot bump.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
